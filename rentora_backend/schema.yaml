components:
  schemas:
    AdminBooking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
        customer_name:
          type: string
          readOnly: true
        vehicle:
          type: integer
        vehicle_details:
          allOf:
          - $ref: '#/components/schemas/VehicleList'
          readOnly: true
        pickup_date:
          type: string
          format: date-time
        return_date:
          type: string
          format: date-time
        pickup_location:
          type: string
          maxLength: 200
        return_location:
          type: string
          maxLength: 200
        total_days:
          type: integer
          readOnly: true
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          $ref: '#/components/schemas/Status071Enum'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - base_price
      - created_at
      - customer
      - customer_name
      - discount_amount
      - id
      - pickup_date
      - pickup_location
      - return_date
      - return_location
      - total_days
      - total_price
      - vehicle
      - vehicle_details
    AdminBookingRequest:
      type: object
      properties:
        customer:
          type: integer
        vehicle:
          type: integer
        pickup_date:
          type: string
          format: date-time
        return_date:
          type: string
          format: date-time
        pickup_location:
          type: string
          minLength: 1
          maxLength: 200
        return_location:
          type: string
          minLength: 1
          maxLength: 200
        promo_code:
          type: string
          writeOnly: true
        status:
          $ref: '#/components/schemas/Status071Enum'
