version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: rentora_postgres
    restart: always
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: rentora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
